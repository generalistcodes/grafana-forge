global:
  scrape_interval: ${FORGE_SCRAPE_INTERVAL}
  evaluation_interval: ${FORGE_SCRAPE_INTERVAL}
rule_files:
  - /etc/prometheus/alerts/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
